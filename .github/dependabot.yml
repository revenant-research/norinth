      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/platform/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /apps/platform
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
