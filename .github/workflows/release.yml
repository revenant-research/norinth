name: Release

# Tag a release (v0.2.0) and this workflow publishes everything a self-hoster
# needs, with provenance:
#   * container image  ghcr.io/revenant-research/norinth:<version>, :latest
#     (multi-arch, cosign keyless signature, SBOM attestation, Trivy scanned)
#   * Helm chart       oci://ghcr.io/revenant-research/charts/norinth
#   * Python SDK       norinth-logger on PyPI (trusted publishing)
#   * GitHub Release   with the CHANGELOG section, SBOM, checksums, and a
#     Sigstore signature of the checksums attached
#
# Pushes to main publish the image as :edge so installers can track the tip.

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  workflow_dispatch:

# Write access is granted per job below; the default is read-only.
# Job-level permissions only: each job below gets exactly the writes it needs,
# so a compromised step in one job cannot use another job's grants.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # Gate the whole release on the same checks CI runs. Tags and pushes to main
  # both build an image, and a tag can be cut from any commit, so without this a
  # release (or an :edge image) could ship from a red tree (audit finding H18).
  verify:
    name: Verify (lint, tests, dashboard build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install Python deps (hash-pinned)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --require-hashes -r requirements-dev.lock.txt
          pip install --no-deps -e packages/python-sdk
      - name: Lint (ruff)
        run: ruff check apps/platform/app packages/python-sdk/norinth_logger tests scripts
      - name: Test (pytest)
        run: pytest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
      - name: Build and test the dashboard
        working-directory: apps/platform/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test

  image:
    name: Container image (build, scan, tag, sign, SBOM)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write      # push the image, signature, and SBOM attestation to GHCR
      packages: write      # push the image and its attestations to GHCR
      id-token: write      # cosign keyless signing
      attestations: write  # GitHub build provenance
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Norinth
            org.opencontainers.image.description=Open-source AI governance from runtime evidence
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Revenant Research
      # Build and push the image by DIGEST ONLY — no floating tag yet. :latest
      # and the version tag are applied only after the scan passes below, so a
      # failing scan can never leave a vulnerable image at a tag the installer
      # pulls (audit finding H18).
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/platform/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Vulnerability scan (Trivy, fail on CRITICAL) — before any tag
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Apply release tags (only reached if the scan passed)
        run: |
          args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && args="$args -t $tag"
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create $args "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless, Sigstore)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Generate SBOM (SPDX) with syft
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attest SBOM to the image
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: GitHub build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.spdx.json

  chart:
    name: Helm chart (package, push OCI)
    runs-on: ubuntu-latest
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write  # push the chart to GHCR
      packages: write      # push the chart to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Lint
        run: helm lint deploy/helm/norinth
      - name: Package with the release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/norinth --version "$VERSION" --app-version "$VERSION" -d dist
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/norinth-*.tgz "oci://${CHART}"

  sdk:
    name: Python SDK (build, publish to PyPI)
    runs-on: ubuntu-latest
    # Publishing needs a PyPI project with a trusted publisher for this repo.
    # Until repository variable PYPI_PUBLISH=true is set, the SDK is built and
    # attached to the GitHub Release instead (pip can install it from there).
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write      # PyPI trusted publishing
    environment: ${{ vars.PYPI_PUBLISH == 'true' && 'pypi' || '' }}
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing
    defaults:
      run:
        working-directory: packages/python-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Version must match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$PKG" || { echo "tag $TAG != pyproject version $PKG"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/requirements-build.txt"
      - name: Build the wheel (build tool hash-pinned)
        run: |
          pip install --require-hashes -r ../../requirements-ci-tools.lock.txt
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-dist
          path: packages/python-sdk/dist/*
      - name: Publish to PyPI (trusted publishing)
        if: vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/python-sdk/dist
          attestations: true
      - name: PyPI publishing not configured
        if: vars.PYPI_PUBLISH != 'true'
        run: echo "Set repository variable PYPI_PUBLISH=true after creating the PyPI project + trusted publisher. The wheel is attached to the GitHub Release."

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [image, chart, sdk]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # create the GitHub Release
      id-token: write  # keyless signing of the checksums file
      contents: write      # create the GitHub Release and attach files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-dist
          path: sdk-dist
      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            /^## \[/ && p {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          # Scope the verify command to THIS repo's release workflow. The old
          # --certificate-identity-regexp ".*" accepted a signature from any
          # workflow in any repository (audit finding H18).
          IDENTITY="^https://github.com/${{ github.repository }}/\\.github/workflows/release\\.yml@refs/tags/"
          printf '\n\n**Image:** `%s@%s`\n**Verify:** `cosign verify %s@%s --certificate-identity-regexp "%s" --certificate-oidc-issuer https://token.actions.githubusercontent.com`\n' \
            "${IMAGE}" "${{ needs.image.outputs.digest }}" "${IMAGE}" "${{ needs.image.outputs.digest }}" "$IDENTITY" >> notes.md
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Checksums
        run: sha256sum sbom.spdx.json scripts/install.sh docker-compose.yml sdk-dist/* > SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums file (keyless, Sigstore)
        run: |
          cosign sign-blob --yes SHA256SUMS \
            --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem
          printf '**Checksums:** `cosign verify-blob SHA256SUMS --signature SHA256SUMS.sig --certificate SHA256SUMS.pem --certificate-identity-regexp "%s" --certificate-oidc-issuer https://token.actions.githubusercontent.com`\n' \
            "$IDENTITY" >> notes.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: notes.md
          files: |
            sbom.spdx.json
            SHA256SUMS
            SHA256SUMS.sig
            SHA256SUMS.pem
            scripts/install.sh
            docker-compose.yml
            sdk-dist/*
