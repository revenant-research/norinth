name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, type, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/python-sdk
      - name: Lint (ruff)
        run: ruff check apps/platform/app packages/python-sdk/norinth_logger tests scripts demo-apps
      - name: Type check (mypy)
        run: mypy packages/python-sdk/norinth_logger || true  # non-blocking baseline; tightened over time
      - name: Test (pytest)
        run: pytest

  python-postgres:
    name: Python tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: norinth
          POSTGRES_PASSWORD: norinth
          POSTGRES_DB: norinth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U norinth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/python-sdk
      - name: Test against PostgreSQL
        env:
          NORINTH_TEST_DATABASE_URL: postgresql://norinth:norinth@127.0.0.1:5432/norinth_test
        run: pytest

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Unit tests (vitest)
        run: npm test
      - name: Type check + build
        run: npm run build
