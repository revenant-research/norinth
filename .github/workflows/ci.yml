name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, type, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/python-sdk
      - name: Lint (ruff)
        run: ruff check apps/platform/app packages/python-sdk/norinth_logger tests scripts
      - name: Type check (mypy)
        run: mypy apps/platform/app packages/python-sdk/norinth_logger
      - name: Test (pytest)
        run: pytest

  python-postgres:
    name: Python tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: norinth
          POSTGRES_PASSWORD: norinth
          POSTGRES_DB: norinth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U norinth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e packages/python-sdk
      - name: Test against PostgreSQL
        env:
          NORINTH_TEST_DATABASE_URL: postgresql://norinth:norinth@127.0.0.1:5432/norinth_test
        run: pytest

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit (production dashboard deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests (vitest)
        run: npm test
      - name: Type check + build
        run: npm run build
      - name: Upload dashboard bundle
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-bundle
          path: apps/platform/app/dashboard/static
          if-no-files-found: error
          retention-days: 14

  serve-bundle:
    name: Platform serves built dashboard
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install platform dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Without a bundle the root route is an explicit 503, never a stale UI
        run: pytest tests/test_dashboard_bundle.py -q -k "not_built"
      - name: Download dashboard bundle
        uses: actions/download-artifact@v8
        with:
          name: dashboard-bundle
          path: apps/platform/app/dashboard/static
      - name: With the bundle the root route serves index.html and its assets
        run: pytest tests/test_dashboard_bundle.py -q -k "built"

  helm:
    name: Helm chart (lint + render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/norinth
      - name: Render with required values
        run: |
          helm template test deploy/helm/norinth \
            --set database.url=postgresql://u:p@h:5432/norinth \
            --set secrets.secretKey=$(openssl rand -base64 32) \
            --set secrets.superAdminPassword=test-password-123 \
            --set ingress.enabled=true > rendered.yaml
          grep -c '^kind:' rendered.yaml
      - name: Refuses to render without secrets
        run: |
          if helm template test deploy/helm/norinth >/dev/null 2>&1; then echo "chart rendered without secrets"; exit 1; fi

  docker:
    name: Docker image (multi-stage build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/platform/Dockerfile
          load: true
          push: false
          tags: norinth-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Dependency audit of the built image (pip-audit on the shipped freeze)
        run: |
          # audit exactly what ships, not a fresh venv: a venv drags in build
          # tools (setuptools, wheel) the slim image does not contain, which
          # produce findings for packages that are never deployed
          docker run --rm --entrypoint python norinth-platform:ci -m pip freeze > shipped-requirements.txt
          echo "shipped packages:"; wc -l < shipped-requirements.txt
          python -m pip install --upgrade pip pip-audit
          pip-audit -r shipped-requirements.txt
      - name: Lint installer scripts (shellcheck)
        run: shellcheck scripts/install.sh scripts/backup.sh scripts/restore.sh
      - name: Installer end-to-end (compose + generated secrets + health)
        env:
          NORINTH_IMAGE: norinth-platform:ci
        run: |
          # Uses the image built above instead of pulling from GHCR.
          NORINTH_REPO_RAW="file://$PWD" bash scripts/install.sh --dir "$PWD/.norinth-install" --port 8002 --yes --no-pull
          curl -fsS http://127.0.0.1:8002/health
          test -f .norinth-install/.env
          grep -q NORINTH_SECRET_KEY .norinth-install/.env
          # Not in development mode: the well-known dev key must be rejected.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8002/v1/events/batch -H 'Authorization: Bearer dev' -H 'Content-Type: application/json' -d '{"events":[]}')
          test "$status" = "401" || { echo "dev key accepted ($status) — installer left development defaults"; exit 1; }
      - name: Backup and restore (real dump, empty dump refused, database replaced)
        run: |
          cd .norinth-install
          # the scripts under test are the ones the installer shipped, not the repo copies
          ./scripts/backup.sh
          dump=$(ls -1 backups/norinth-*.sql.gz | head -1)
          # a dump that restores to nothing is still valid gzip, so check for SQL
          test "$(gunzip -c "$dump" | wc -c)" -gt 100 || { echo "backup carries no SQL"; exit 1; }
          # a failed run must not leave anything that looks like a backup
          ls backups/*.partial >/dev/null 2>&1 && { echo "a partial dump was left behind"; exit 1; }
          # restore must refuse an empty dump before it drops the database
          : | gzip > backups/empty.sql.gz
          if printf 'restore\n' | ./scripts/restore.sh backups/empty.sql.gz; then
            echo "restore accepted a dump with no SQL"; exit 1
          fi
          curl -fsS http://127.0.0.1:8002/health >/dev/null || { echo "refused restore still disturbed the database"; exit 1; }
          # anything written after the backup is gone once the backup is restored
          docker compose exec -T postgres psql -U norinth -d norinth -c "CREATE TABLE ci_marker (id int);"
          printf 'restore\n' | ./scripts/restore.sh "$dump"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8002/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8002/health
          marker=$(docker compose exec -T postgres psql -U norinth -d norinth -tAc "SELECT to_regclass('public.ci_marker');")
          case "$marker" in *ci_marker*) echo "restore did not replace the database"; exit 1 ;; esac
          docker compose down -v
      - name: Smoke test (health + built dashboard served)
        run: |
          docker run -d --name norinth -p 8001:8001 norinth-platform:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/health
          status=$(curl -s -o /tmp/index.html -w '%{http_code}' http://127.0.0.1:8001/)
          test "$status" = "200" || { echo "root returned $status"; cat /tmp/index.html; exit 1; }
          grep -q '/assets/index-' /tmp/index.html
          asset=$(grep -o '/assets/index-[^"]*\.js' /tmp/index.html | head -1)
          curl -fsS -o /dev/null "http://127.0.0.1:8001$asset"
          docker logs norinth | tail -5
          docker rm -f norinth
