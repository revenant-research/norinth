{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.superAdminPassword }}{{ fail "secrets.superAdminPassword is required (or set secrets.existingSecret)" }}{{ end }}
{{- if not .Values.secrets.secretKey }}{{ fail "secrets.secretKey is required: openssl rand -base64 32 (or set secrets.existingSecret)" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "norinth.fullname" . }}-secrets
  labels: {{- include "norinth.labels" . | nindent 4 }}
type: Opaque
stringData:
  NORINTH_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  NORINTH_SUPER_ADMIN_PASSWORD: {{ .Values.secrets.superAdminPassword | quote }}
{{- end }}
---
{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.url }}{{ fail "database.url is required (or set database.existingSecret)" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "norinth.fullname" . }}-database
  labels: {{- include "norinth.labels" . | nindent 4 }}
type: Opaque
stringData:
  NORINTH_DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
