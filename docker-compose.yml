services:
  norinth-platform:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    container_name: norinth-platform
    ports:
      - "8001:8001"
    volumes:
      - norinth-data:/app/data
    environment:
      # Must match the variable the application actually reads (storage/raw_events.py).
      - NORINTH_PLATFORM_DB=/app/data/norinth.sqlite3
    restart: unless-stopped

volumes:
  norinth-data:
