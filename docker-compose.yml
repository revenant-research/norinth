# Norinth — production-shaped Docker Compose.
#
# Secrets come from .env (generated by scripts/install.sh; never commit it).
# PostgreSQL is the default database. Volumes are named so `docker compose
# down` keeps your data; `scripts/backup.sh` dumps it.
#
#   scripts/install.sh          # first install (generates .env, starts, waits)
#   docker compose up -d        # start
#   docker compose pull && docker compose up -d   # upgrade (migrations run on boot)
#   scripts/backup.sh           # PostgreSQL dump to ./backups

services:
  norinth:
    image: ${NORINTH_IMAGE:-ghcr.io/revenant-research/norinth:latest}
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    container_name: norinth
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${NORINTH_PORT:-8001}:8001"
    environment:
      NORINTH_DATABASE_URL: postgresql://norinth:${POSTGRES_PASSWORD}@postgres:5432/norinth
      NORINTH_SECRET_KEY: ${NORINTH_SECRET_KEY}
      NORINTH_SUPER_ADMIN_EMAIL: ${NORINTH_SUPER_ADMIN_EMAIL:-admin@norinth.local}
      NORINTH_SUPER_ADMIN_PASSWORD: ${NORINTH_SUPER_ADMIN_PASSWORD}
      NORINTH_PUBLIC_BASE_URL: ${NORINTH_PUBLIC_BASE_URL:-http://localhost:8001}
      NORINTH_COOKIE_SECURE: ${NORINTH_COOKIE_SECURE:-0}
      NORINTH_TRUST_PROXY: ${NORINTH_TRUST_PROXY:-0}
      NORINTH_SESSION_TTL_HOURS: ${NORINTH_SESSION_TTL_HOURS:-12}
      NORINTH_SMTP_HOST: ${NORINTH_SMTP_HOST:-}
      NORINTH_SMTP_PORT: ${NORINTH_SMTP_PORT:-587}
      NORINTH_SMTP_USER: ${NORINTH_SMTP_USER:-}
      NORINTH_SMTP_PASSWORD: ${NORINTH_SMTP_PASSWORD:-}
      NORINTH_SMTP_FROM: ${NORINTH_SMTP_FROM:-}
      NORINTH_SMTP_STARTTLS: ${NORINTH_SMTP_STARTTLS:-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    # pinned by digest; a tag can be repointed under a running fleet
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    container_name: norinth-postgres
    environment:
      POSTGRES_USER: norinth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: norinth
    volumes:
      - norinth-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norinth -d norinth"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  norinth-pgdata:
