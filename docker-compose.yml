version: '3.8'

services:
  norinth-platform:
    build: 
      context: .
      dockerfile: apps/platform/Dockerfile
    container_name: norinth-platform
    ports:
      - "8001:8001"
    volumes:
      - norinth-data:/app/data
    environment:
      - NORINTH_DB_PATH=/app/data/norinth.db
    restart: unless-stopped

volumes:
  norinth-data:
